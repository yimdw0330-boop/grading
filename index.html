<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>플러스발상 채점</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;700&display=swap');

:root {
  --bg: #f7f6f2;
  --white: #ffffff;
  --border: #e5e3dc;
  --accent: #1a1a1a;
  --green: #1e7a4a;
  --green-bg: #eaf7f0;
  --red: #c0392b;
  --red-bg: #fdf0ee;
  --yellow: #d4820a;
  --yellow-bg: #fef6e4;
  --blue: #1a56a0;
  --blue-bg: #eaf1fb;
  --muted: #999;
  --muted2: #bbb;
  --text: #1a1a1a;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--accent);
  padding: 15px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-brand {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
}
.topbar-title {
  font-size: 15px;
  font-weight: 700;
  color: white;
  margin-left: auto;
}

/* ── SCREENS ── */
main { max-width: 480px; margin: 0 auto; padding: 20px 16px 80px; }
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* ── CARDS ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

/* ── INPUT ── */
.input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.input:focus { border-color: var(--accent); }
select.input { cursor: pointer; }

/* ── BUTTON ── */
.btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: white; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── UPLOAD ZONE ── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 14px;
  background: var(--bg);
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
}
.upload-zone:hover { border-color: var(--accent); background: rgba(26,26,26,0.03); }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-icon { font-size: 2.2rem; margin-bottom: 10px; display: block; }
.upload-label { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
.upload-sub { font-size: 13px; color: var(--muted); }

.preview-wrap { position: relative; display: none; }
.preview-img { width: 100%; border-radius: 12px; display: block; max-height: 320px; object-fit: contain; background: var(--bg); }
.preview-change {
  position: absolute; bottom: 10px; right: 10px;
  background: rgba(0,0,0,0.7); color: white;
  border: none; border-radius: 8px;
  padding: 6px 12px; font-size: 12px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
}

/* ── SPINNER ── */
.spinner {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.loading .spinner { display: block; }
.loading .btn-text { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESULT ── */
.score-hero {
  text-align: center;
  padding: 28px 20px 24px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
}
.score-ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
}
.score-num {
  font-family: 'DM Mono', monospace;
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
}
.score-unit { font-size: 12px; opacity: 0.6; margin-top: 2px; }
.score-name { font-size: 17px; font-weight: 700; }
.score-sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

/* ── RESULT ROWS ── */
.result-list { padding: 4px 0; }
.result-row {
  display: flex;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.result-row:last-child { border-bottom: none; }
.rnum {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  min-width: 34px;
}
.rcontent { flex: 1; }
.rstudent { font-size: 14px; font-weight: 500; }
.rcorrect { font-size: 12px; color: var(--muted); margin-top: 2px; }
.rbadge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 7px;
  white-space: nowrap;
}
.badge-o { background: var(--green-bg); color: var(--green); }
.badge-x { background: var(--red-bg); color: var(--red); }
.badge-pending { background: var(--yellow-bg); color: var(--yellow); }

/* ── OOPS NOTE ── */
.wrong-summary {
  background: var(--red-bg);
  border: 1px solid rgba(192,57,43,0.2);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.wrong-title { font-size: 12px; font-weight: 700; color: var(--red); margin-bottom: 6px; }
.wrong-nums { font-size: 14px; font-weight: 500; line-height: 1.8; }

/* ── INFO ── */
.info-box {
  background: var(--blue-bg);
  border: 1px solid rgba(26,86,160,0.15);
  border-radius: 12px;
  padding: 13px 16px;
  font-size: 13px;
  color: var(--blue);
  line-height: 1.6;
  margin-bottom: 12px;
}

/* ── ERROR ── */
.error-msg { color: var(--red); font-size: 13px; margin-top: 6px; text-align: center; min-height: 18px; }

/* ── LOADING SCREEN ── */
.loading-screen {
  text-align: center;
  padding: 60px 20px;
}
.loading-spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
.loading-msg { font-size: 14px; color: var(--muted); }
.loading-sub { font-size: 12px; color: var(--muted2); margin-top: 6px; }

/* ── STEP INDICATOR ── */
.steps {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 20px;
  padding: 0 4px;
}
.step {
  flex: 1;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted2);
  position: relative;
}
.step.active { color: var(--accent); }
.step.done { color: var(--green); }
.step-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 5px;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
}
.step.active .step-dot { background: var(--accent); color: white; }
.step.done .step-dot { background: var(--green); color: white; }
.step-line {
  height: 2px;
  background: var(--border);
  flex: 1;
  margin-top: -17px;
  position: relative;
  z-index: -1;
}
</style>
</head>

      <div class="upload-label">답안지 사진 찍기</div>
      <div class="upload-sub">번호별로 쓴 답안지를 찍어주세요</div>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <img class="preview-img" id="preview-img" src="" alt="">
      <button class="preview-change" onclick="resetPhoto()">↩ 다시 찍기</button>
    </div>
  </div>

  <div id="upload-error" class="error-msg"></div>
  <button class="btn btn-primary" id="grade-btn" onclick="startGrading()">
    <div class="spinner"></div>
    <span class="btn-text">✦ 채점하기</span>
  </button>
  <button class="btn btn-outline" onclick="goBack()" style="margin-top:8px">← 뒤로</button>
</div>

<!-- ── SCREEN 3: 채점 중 ── -->
<div class="screen" id="screen-loading">
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-msg">AI가 답안지를 읽고 있어요...</div>
    <div class="loading-sub">잠깐만 기다려주세요 (10~20초)</div>
  </div>
</div>

<!-- ── SCREEN 4: 결과 ── -->

  <div style="height:16px"></div>

  <div class="steps">
    <div class="step done"><div class="step-dot">✓</div><div>정보입력</div></div>

    <div class="step done"><div class="step-dot">✓</div><div>사진업로드</div></div>
    <div class="step-line"></div>
    <div class="step active"><div class="step-dot">3</div><div>채점결과</div></div>

  <div class="score-hero">
    <div class="score-ring">
      <div class="score-num" id="r-score">-</div>

    </div>

  <button class="btn btn-primary" onclick="resetAll()" style="margin-top:8px">처음으로</button>

</main>

// ================================================================
// 상태
// ================================================================
var state = {
  quizId: '',
  studentName: '',
  imageBase64: null,
  imageType: 'image/jpeg',
};

// ================================================================
// 화면 전환
// ================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ================================================================
// STEP 1 → 2
// ================================================================
function goToUpload() {
  var quizId = document.getElementById('quiz-select').value;
  var name = document.getElementById('student-name').value.trim();
  var err = document.getElementById('select-error');
  if (!quizId) { err.textContent = '시험지를 선택해주세요.'; return; }
  if (!name) { err.textContent = '이름을 입력해주세요.'; return; }
  err.textContent = '';
  state.quizId = quizId;
  state.studentName = name;

  var quiz = QUIZ_DATA[quizId];
  var autoCount = quiz.problems.filter(function(p) { return p.type !== 'teacher'; }).length;
  var teacherCount = quiz.problems.filter(function(p) { return p.type === 'teacher'; }).length;

  document.getElementById('upload-info-box').innerHTML =
    '<strong>' + quiz.name + '</strong> · ' + name + ' 학생<br>' +
    '자동채점 ' + autoCount + '문제 + 선생님채점 ' + teacherCount + '문제';

  document.getElementById('topbar-title').textContent = name + ' 채점';
  showScreen('screen-upload');
}

function goBack() {
  showScreen('screen-select');
}

function onFileSelected(e) {
  var file = e.target.files[0];
  if (!file) return;
  state.imageType = file.type || 'image/jpeg';
  var reader = new FileReader();
  reader.onload = function(ev) {
    state.imageBase64 = ev.target.result.split(',')[1];
    document.getElementById('preview-img').src = ev.target.result;
    document.getElementById('upload-zone').style.display = 'none';
    document.getElementById('preview-wrap').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function resetPhoto() {
  state.imageBase64 = null;
  document.getElementById('file-input').value = '';
  document.getElementById('upload-zone').style.display = 'block';
  document.getElementById('preview-wrap').style.display = 'none';
}

// ================================================================
// 채점 시작
// ================================================================
async function startGrading() {
  var err = document.getElementById('upload-error');
  if (!state.imageBase64) { err.textContent = '사진을 먼저 올려주세요.'; return; }
  err.textContent = '';

  showScreen('screen-loading');

  try {
    // 1. Claude가 사진에서 답 읽기
    var extracted = await extractAnswersFromPhoto(state.imageBase64, state.imageType);
    // 2. 채점
    var result = gradeAnswers(extracted);
    // 3. 결과 표시
    showResult(result);
  } catch(e) {
    showScreen('screen-upload');
    document.getElementById('upload-error').textContent = '오류: ' + e.message;
  }
}

// ================================================================
// Claude API: 사진에서 답 추출
// ================================================================
async function extractAnswersFromPhoto(b64, mediaType) {
  var quiz = QUIZ_DATA[state.quizId];
  var autoProblems = quiz.problems.filter(function(p) { return p.type !== 'teacher'; });
  var numList = autoProblems.map(function(p) { return p.num + '번'; }).join(', ');

  var prompt = '이 사진은 수학 답안지입니다.\n' +
    '다음 문제 번호의 학생 답을 읽어주세요: ' + numList + '\n\n' +
    '규칙:\n' +
    '- 반드시 JSON 배열로만 응답\n' +
    '- 형식: [{"num": 문제번호, "answer": "학생답"}, ...]\n' +
    '- 답이 안 보이거나 비어있으면 "": ""\n' +
    '- 마크다운, 코드블록 없이 JSON만 출력\n' +
    '- 객관식은 숫자만 (예: "3"), 단답형은 쓴 그대로';

  var response = await fetch(WORKERS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
          { type: 'text', text: prompt }
        ]
      }]
    })
  });

  if (!response.ok) {
    throw new Error('서버 오류 ' + response.status);
  }

  var data = await response.json();

  if (data.error) {
    throw new Error(data.error.message || JSON.stringify(data.error));
  }

  if (!data.content || !Array.isArray(data.content)) {
    throw new Error('응답 오류: ' + JSON.stringify(data).substring(0, 100));
  }

  var raw = data.content.map(function(c) { return c.text || ''; }).join('');
  var cleaned = raw.replace(/```json|```/g, '').trim();

  var parsed = JSON.parse(cleaned);
  // 배열 → 번호 맵으로 변환
  var answerMap = {};
  parsed.forEach(function(item) {
    answerMap[String(item.num)] = String(item.answer || '').trim();
  });
  return answerMap;
}

// ================================================================
// 채점 로직
// ================================================================
function normalize(str) {
  return String(str).replace(/\s/g, '').toLowerCase()
    .replace(/×/g, '*').replace(/÷/g, '/');
}

function gradeAnswers(extractedMap) {
  var quiz = QUIZ_DATA[state.quizId];
  var correct = 0, autoTotal = 0, teacherTotal = 0;
  var details = [];

  quiz.problems.forEach(function(p) {
    if (p.type === 'teacher') {
      teacherTotal++;
      details.push({ num: p.num, type: 'teacher', studentAns: '', correctAns: p.answer, status: 'pending' });
      return;
    }
    autoTotal++;
    var studentAns = extractedMap[String(p.num)] || '';
    var isCorrect = normalize(studentAns) === normalize(p.answer);
    if (isCorrect) correct++;
    details.push({
      num: p.num,
      type: p.type,
      studentAns: studentAns,
      correctAns: p.answer,
      status: isCorrect ? 'correct' : 'wrong'
    });
  });

  var score = autoTotal > 0 ? Math.round((correct / autoTotal) * 100) : 0;
  return {
    studentName: state.studentName,
    quizName: quiz.name,
    correct: correct,
    autoTotal: autoTotal,
    teacherTotal: teacherTotal,
    score: score,
    details: details
  };
}

// ================================================================
// 결과 표시
// ================================================================
function showResult(r) {
  document.getElementById('r-score').textContent = r.score;
  document.getElementById('r-name').textContent = r.studentName + ' 학생';
  document.getElementById('r-fraction').textContent =
    '자동채점 ' + r.correct + '/' + r.autoTotal + '  |  선생님채점 ' + r.teacherTotal + '문제';

  // 오답 목록
  var wrongNums = r.details.filter(function(d) { return d.status === 'wrong'; }).map(function(d) { return d.num + '번'; });
  var wrongWrap = document.getElementById('wrong-summary-wrap');
  if (wrongNums.length > 0) {
    wrongWrap.innerHTML = '<div class="wrong-summary"><div class="wrong-title">❌ 틀린 문제 (' + wrongNums.length + '개)</div><div class="wrong-nums">' + wrongNums.join('  ·  ') + '</div></div>';
  } else {
    wrongWrap.innerHTML = '';
  }

  // 문제별 결과
  var list = document.getElementById('result-list');
  list.innerHTML = '';
  r.details.forEach(function(d) {
    var row = document.createElement('div');
    row.className = 'result-row';

    if (d.status === 'pending') {
      row.innerHTML =
        '<div class="rnum">' + d.num + '번</div>' +
        '<div class="rcontent"><div class="rstudent">서술형</div></div>' +
        '<div class="rbadge badge-pending">채점대기</div>';
    } else {
      var wrongPart = d.status === 'wrong' ? '<div class="rcorrect">정답: ' + d.correctAns + '</div>' : '';
      row.innerHTML =
        '<div class="rnum">' + d.num + '번</div>' +
        '<div class="rcontent"><div class="rstudent">내 답: ' + (d.studentAns || '(미기재)') + '</div>' + wrongPart + '</div>' +
        '<div class="rbadge ' + (d.status === 'correct' ? 'badge-o' : 'badge-x') + '">' + (d.status === 'correct' ? '✓' : '✗') + '</div>';
    }
    list.appendChild(row);
  });

  // 선생님 채점 대기 목록
  var teacherNums = r.details.filter(function(d) { return d.status === 'pending'; }).map(function(d) { return d.num + '번'; });
  var tw = document.getElementById('teacher-wrap');
  if (teacherNums.length > 0) {
    tw.innerHTML = '<div class="card" style="margin-top:0"><div class="card-title">선생님 채점 대기</div><div style="font-size:13px;color:var(--muted);line-height:1.8">' + teacherNums.join(', ') + '</div></div>';
  } else {
    tw.innerHTML = '';
  }

  showScreen('screen-result');
}

// ================================================================
// 초기화
// ================================================================
function resetAll() {
  state.quizId = '';
  state.studentName = '';
  state.imageBase64 = null;
  document.getElementById('quiz-select').value = '';
  document.getElementById('student-name').value = '';
  document.getElementById('select-error').textContent = '';
  resetPhoto();
  document.getElementById('topbar-title').textContent = '숙제 채점';
  showScreen('screen-select');
}
</script>
