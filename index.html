<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>플러스발상 채점시스템</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;700&display=swap');

:root {
  --bg: #f7f6f2;
  --white: #ffffff;
  --border: #e5e3dc;
  --accent: #1a1a1a;
  --green: #1e7a4a;
  --green-bg: #eaf7f0;
  --red: #c0392b;
  --red-bg: #fdf0ee;
  --yellow: #d4820a;
  --yellow-bg: #fef6e4;
  --blue: #1a56a0;
  --blue-bg: #eaf1fb;
  --muted: #999;
  --muted2: #bbb;
  --text: #1a1a1a;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.topbar {
  background: var(--accent); padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar-logo { font-family: 'DM Mono', monospace; font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
.topbar-title { font-size: 15px; font-weight: 700; color: white; }

.mode-bar {
  background: var(--white); border-bottom: 1px solid var(--border);
  display: flex; padding: 0 16px;
}
.mode-tab {
  flex: 1; padding: 14px 8px; font-size: 14px; font-weight: 500;
  color: var(--muted); border: none; background: transparent;
  border-bottom: 2px solid transparent; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
}
.mode-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

main { max-width: 480px; margin: 0 auto; padding: 20px 16px 80px; }
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
.card-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

.input {
  width: 100%; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 13px 16px;
  font-family: 'Noto Sans KR', sans-serif; font-size: 15px; color: var(--text);
  outline: none; transition: border-color 0.2s; -webkit-appearance: none;
}
.input:focus { border-color: var(--accent); }
select.input { cursor: pointer; }

.btn {
  width: 100%; padding: 15px; border-radius: 12px; border: none;
  font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; margin-top: 8px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); color: white; }
.btn-green { background: var(--green); color: white; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-yellow { background: var(--yellow); color: white; }
.btn-red { background: var(--red); color: white; }
.btn-blue { background: var(--blue); color: white; }

.spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
.loading .spinner { display: block; }
.loading .btn-text { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.score-hero { text-align: center; padding: 28px 20px 24px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; }
.score-ring { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 14px; }
.score-num { font-family: 'DM Mono', monospace; font-size: 36px; font-weight: 700; line-height: 1; }
.score-unit { font-size: 12px; opacity: 0.6; margin-top: 2px; }
.score-name { font-size: 17px; font-weight: 700; }
.score-sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

.result-row { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 10px; }
.result-row:last-child { border-bottom: none; }
.rnum { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); min-width: 34px; }
.rcontent { flex: 1; }
.rstudent { font-size: 14px; font-weight: 500; }
.rbadge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 7px; white-space: nowrap; }
.badge-o { background: var(--green-bg); color: var(--green); }
.badge-x { background: var(--red-bg); color: var(--red); }
.badge-pending { background: var(--yellow-bg); color: var(--yellow); }
.badge-teacher { background: var(--blue-bg); color: var(--blue); }

.wrong-summary { background: var(--red-bg); border: 1px solid rgba(192,57,43,0.2); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.wrong-title { font-size: 12px; font-weight: 700; color: var(--red); margin-bottom: 6px; }
.wrong-nums { font-size: 14px; font-weight: 500; line-height: 1.8; }

.info-box { background: var(--blue-bg); border: 1px solid rgba(26,86,160,0.15); border-radius: 12px; padding: 13px 16px; font-size: 13px; color: var(--blue); line-height: 1.6; margin-bottom: 12px; }
.success-box { background: var(--green-bg); border: 1px solid rgba(30,122,74,0.2); border-radius: 12px; padding: 13px 16px; font-size: 13px; color: var(--green); line-height: 1.6; margin-bottom: 12px; }
.error-box { background: var(--red-bg); border: 1px solid rgba(192,57,43,0.2); border-radius: 12px; padding: 13px 16px; font-size: 13px; color: var(--red); line-height: 1.6; margin-bottom: 12px; }
.error-msg { color: var(--red); font-size: 13px; margin-top: 6px; text-align: center; min-height: 18px; }

.loading-screen { text-align: center; padding: 60px 20px; }
.loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
.loading-msg { font-size: 14px; color: var(--muted); }
.loading-sub { font-size: 12px; color: var(--muted2); margin-top: 6px; }

.steps { display: flex; align-items: center; margin-bottom: 20px; padding: 0 4px; }
.step { flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted2); }
.step.active { color: var(--accent); }
.step.done { color: var(--green); }
.step-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-size: 11px; font-family: 'DM Mono', monospace; }
.step.active .step-dot { background: var(--accent); color: white; }
.step.done .step-dot { background: var(--green); color: white; }
.step-line { height: 2px; background: var(--border); flex: 1; margin-top: -17px; position: relative; z-index: -1; }

/* ── 답안 입력 ── */
.answer-item {
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px; background: var(--white);
  transition: border-color 0.2s;
}
.answer-item.active { border-color: var(--accent); }
.answer-item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.answer-num {
  font-family: 'DM Mono', monospace; font-weight: 700; font-size: 13px;
  background: var(--accent); color: white; width: 28px; height: 28px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.answer-type { font-size: 11px; color: var(--muted); font-weight: 600; }

/* 객관식 버튼 */
.choice-btns { display: flex; gap: 8px; }
.choice-btn {
  flex: 1; padding: 10px 4px; border-radius: 10px; border: 2px solid var(--border);
  font-size: 16px; font-weight: 700; cursor: pointer; background: var(--bg);
  color: var(--text); font-family: 'DM Mono', monospace; transition: all 0.15s;
}
.choice-btn.selected { border-color: var(--accent); background: var(--accent); color: white; }
.choice-btn:active { transform: scale(0.95); }

/* 주관식 입력 */
.subjective-input {
  width: 100%; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
  font-family: 'DM Mono', monospace; font-size: 16px; color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.subjective-input:focus { border-color: var(--accent); }
.input-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* 선생님 채점 요청 버튼 */
.teacher-req-btn {
  width: 100%; padding: 8px; border-radius: 8px; border: 1.5px dashed var(--blue);
  font-size: 12px; font-weight: 600; cursor: pointer; background: transparent;
  color: var(--blue); font-family: 'Noto Sans KR', sans-serif; margin-top: 6px;
  transition: all 0.15s;
}
.teacher-req-btn.active { background: var(--blue-bg); }
.teacher-req-btn:active { transform: scale(0.98); }

/* 결과 수정 버튼 */
.edit-btn {
  padding: 4px 10px; border-radius: 6px; border: 1.5px solid var(--border);
  font-size: 11px; cursor: pointer; background: transparent; color: var(--muted);
  font-family: 'Noto Sans KR', sans-serif; white-space: nowrap;
}
.edit-btn:active { background: var(--bg); }

/* 퀴즈 목록 */
.quiz-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.quiz-item:last-child { border-bottom: none; }
.quiz-name { font-size: 14px; font-weight: 500; }
.quiz-count { font-size: 12px; color: var(--muted); margin-top: 3px; }
.quiz-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 7px; background: var(--green-bg); color: var(--green); }

/* 진행률 바 */
.progress-bar-wrap { background: var(--border); border-radius: 4px; height: 4px; margin-bottom: 16px; }
.progress-bar { background: var(--accent); border-radius: 4px; height: 4px; transition: width 0.3s; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">✦ PLUS</div>
  <div class="topbar-title" id="topbar-title">채점시스템</div>
</div>

<div class="mode-bar">
  <button class="mode-tab active" onclick="switchMode('student')">학생 채점</button>
  <button class="mode-tab" onclick="switchMode('teacher')">선생님</button>
</div>

<main>

<!-- ── 학생 STEP1: 정보입력 ── -->
<div class="view active" id="v-student-select">
  <div style="height:16px"></div>
  <div class="steps">
    <div class="step active"><div class="step-dot">1</div><div>정보입력</div></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-dot">2</div><div>답안입력</div></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-dot">3</div><div>결과</div></div>
  </div>
  <div class="card">
    <div class="card-title">시험지 선택</div>
    <select class="input" id="s-quiz-select">
      <option value="">불러오는 중...</option>
    </select>
  </div>
  <div class="card">
    <div class="card-title">이름</div>
    <input class="input" type="text" id="s-name" placeholder="이름 입력" maxlength="10" autocomplete="off">
  </div>
  <div id="s-select-err" class="error-msg"></div>
  <button class="btn btn-primary" onclick="sGoToInput()">다음 →</button>
</div>

<!-- ── 학생 STEP2: 답안 입력 ── -->
<div class="view" id="v-student-input">
  <div style="height:16px"></div>
  <div class="steps">
    <div class="step done"><div class="step-dot">✓</div><div>정보입력</div></div>
    <div class="step-line"></div>
    <div class="step active"><div class="step-dot">2</div><div>답안입력</div></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-dot">3</div><div>결과</div></div>
  </div>
  <div class="info-box" id="s-input-info"></div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="s-progress" style="width:0%"></div></div>
  <div id="s-answer-list"></div>
  <div id="s-input-err" class="error-msg"></div>
  <button class="btn btn-primary" onclick="sSubmitAnswers()">
    <div class="spinner"></div>
    <span class="btn-text">✦ 채점하기</span>
  </button>
  <button class="btn btn-outline" onclick="showView('v-student-select')" style="margin-top:8px">← 뒤로</button>
</div>

<!-- ── 학생 STEP3: 결과 ── -->
<div class="view" id="v-student-result">
  <div style="height:16px"></div>
  <div class="steps">
    <div class="step done"><div class="step-dot">✓</div><div>정보입력</div></div>
    <div class="step-line"></div>
    <div class="step done"><div class="step-dot">✓</div><div>답안입력</div></div>
    <div class="step-line"></div>
    <div class="step active"><div class="step-dot">3</div><div>결과</div></div>
  </div>
  <div class="score-hero">
    <div class="score-ring">
      <div class="score-num" id="r-score">-</div>
      <div class="score-unit">점</div>
    </div>
    <div class="score-name" id="r-name"></div>
    <div class="score-sub" id="r-fraction"></div>
  </div>
  <div id="r-wrong-wrap"></div>

  <!-- 답안 수정 섹션 -->
  <div class="card" id="r-edit-wrap" style="display:none">
    <div class="card-title">✏️ 답안 수정</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">잘못 입력한 번호를 수정하고 재채점하세요</div>
    <div id="r-edit-list"></div>
    <button class="btn btn-yellow" onclick="sRegrade()" style="margin-top:8px">
      <div class="spinner"></div>
      <span class="btn-text">↺ 재채점하기</span>
    </button>
  </div>

  <div class="card">
    <div class="card-title">문제별 결과</div>
    <div id="r-detail"></div>
  </div>
  <div id="r-teacher-wrap"></div>
  <button class="btn btn-primary" onclick="sReset()" style="margin-top:8px">처음으로</button>
</div>

<!-- ── 선생님 VIEW ── -->
<div class="view" id="v-teacher-main">
  <div style="height:16px"></div>
  <div class="card">
    <div class="card-title">등록된 시험지</div>
    <div id="t-quiz-list">
      <div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">불러오는 중...</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📄 PDF로 정답 등록</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6">
      답지 PDF를 올리면 AI가 읽어서 자동으로 정답을 등록해요.
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">시험지 ID</div>
      <input class="input" type="text" id="t-quiz-id" placeholder="예: 공통수학I_1-2_(K1)" autocomplete="off">
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">시험지 이름</div>
      <input class="input" type="text" id="t-quiz-name" placeholder="예: 공통수학I 1-2 K1" autocomplete="off">
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">문제 수</div>
      <input class="input" type="number" id="t-quiz-count" placeholder="예: 54" min="1" max="200">
    </div>
    <div class="upload-zone" id="t-upload-zone" style="border:2px dashed var(--border);border-radius:14px;background:var(--bg);padding:24px;text-align:center;cursor:pointer;position:relative;overflow:hidden;">
      <input type="file" id="t-pdf-file" accept="application/pdf,image/*" onchange="tOnFile(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
      <div style="font-size:2rem;margin-bottom:8px">📎</div>
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">답지 PDF 또는 사진 올리기</div>
      <div style="font-size:12px;color:var(--muted)">파일을 선택해주세요</div>
    </div>
    <div id="t-file-name" style="font-size:13px;color:var(--green);margin-top:8px;display:none"></div>
    <div id="t-upload-msg"></div>
    <button class="btn btn-green" id="t-register-btn" onclick="tRegisterQuiz()">
      <div class="spinner"></div>
      <span class="btn-text">✦ 정답 등록하기</span>
    </button>
  </div>
</div>

</main>

<script>
var WORKERS_URL = 'https://restless-queen-374b.yimdw0330.workers.dev';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyMnbbiat1wf77YHc3iYqzfT-MuEb_-BR7VYismnNDSBFn1mY4deohvRMbl58AN6t-t/exec';

var sState = {
  quizId: '', quizName: '', problems: [], studentName: '',
  answers: {}, teacherRequested: new Set()
};
var tState = { fileBase64: null, fileType: null };
var currentMode = 'student';

// ── 모드 전환 ──
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(function(t, i) {
    t.classList.toggle('active', (mode==='student'&&i===0)||(mode==='teacher'&&i===1));
  });
  if (mode === 'student') {
    showView('v-student-select');
    document.getElementById('topbar-title').textContent = '학생 채점';
    loadQuizList('s-quiz-select');
  } else {
    showView('v-teacher-main');
    document.getElementById('topbar-title').textContent = '선생님';
    loadTeacherQuizList();
  }
}

function showView(id) {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── 시험지 목록 ──
function loadQuizList(selectId) {
  var sel = document.getElementById(selectId);
  sel.innerHTML = '<option value="">불러오는 중...</option>';
  fetch(GAS_URL, { method:'POST', body:JSON.stringify({action:'getQuizList'}) })
  .then(function(r){return r.json();})
  .then(function(data){
    if (data.success && data.list.length > 0) {
      sel.innerHTML = '<option value="">시험지를 선택하세요</option>';
      data.list.forEach(function(q){
        sel.innerHTML += '<option value="'+q.id+'">'+q.name+' ('+q.count+'문제)</option>';
      });
    } else {
      sel.innerHTML = '<option value="">등록된 시험지가 없습니다</option>';
    }
  }).catch(function(){ sel.innerHTML = '<option value="">불러오기 실패</option>'; });
}

function loadTeacherQuizList() {
  var container = document.getElementById('t-quiz-list');
  container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">불러오는 중...</div>';
  fetch(GAS_URL, { method:'POST', body:JSON.stringify({action:'getQuizList'}) })
  .then(function(r){return r.json();})
  .then(function(data){
    if (data.success && data.list.length > 0) {
      container.innerHTML = '';
      data.list.forEach(function(q){
        var item = document.createElement('div');
        item.className = 'quiz-item';
        item.innerHTML = '<div><div class="quiz-name">'+q.name+'</div><div class="quiz-count">'+q.count+'문제</div></div><div class="quiz-badge">등록됨</div>';
        container.appendChild(item);
      });
    } else {
      container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">등록된 시험지가 없어요.</div>';
    }
  }).catch(function(){ container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);font-size:13px">불러오기 실패</div>'; });
}

// ── 학생 STEP1 → STEP2 ──
function sGoToInput() {
  var quizId = document.getElementById('s-quiz-select').value;
  var name = document.getElementById('s-name').value.trim();
  var err = document.getElementById('s-select-err');
  if (!quizId) { err.textContent = '시험지를 선택해주세요.'; return; }
  if (!name) { err.textContent = '이름을 입력해주세요.'; return; }
  err.textContent = '';

  sState.quizId = quizId;
  sState.studentName = name;
  sState.answers = {};
  sState.teacherRequested = new Set();

  fetch(GAS_URL, { method:'POST', body:JSON.stringify({action:'getAnswers', quizId:quizId}) })
  .then(function(r){return r.json();})
  .then(function(data){
    if (!data.success || data.problems.length === 0) {
      err.textContent = '정답 데이터를 불러오지 못했습니다.'; return;
    }
    sState.problems = data.problems;
    var sel = document.getElementById('s-quiz-select');
    sState.quizName = sel.options[sel.selectedIndex].text;

    document.getElementById('s-input-info').innerHTML =
      '<strong>'+sState.quizName+'</strong> · '+name+' 학생<br>총 '+data.problems.length+'문제 — 답을 입력하고 채점하기를 눌러주세요';
    document.getElementById('topbar-title').textContent = name+' 채점';

    buildAnswerInputs();
    showView('v-student-input');
  })
  .catch(function(){ err.textContent = '네트워크 오류가 발생했습니다.'; });
}

// ── 답안 입력 폼 생성 ──
function buildAnswerInputs() {
  var list = document.getElementById('s-answer-list');
  list.innerHTML = '';
  updateProgress();

  sState.problems.forEach(function(p) {
    var div = document.createElement('div');
    div.className = 'answer-item';
    div.id = 'item-'+p.num;

    var typeLabel = p.type === '객관식5' ? '객관식' : '주관식';
    var headerHtml = '<div class="answer-item-header"><div class="answer-num">'+p.num+'</div><div class="answer-type">'+typeLabel+'</div></div>';

    if (p.type === '객관식5') {
      var btns = '';
      for (var i=1; i<=5; i++) {
        btns += '<button class="choice-btn" onclick="selectChoice('+p.num+','+i+')" id="cb-'+p.num+'-'+i+'">'+i+'</button>';
      }
      div.innerHTML = headerHtml + '<div class="choice-btns">'+btns+'</div>';
    } else {
      div.innerHTML = headerHtml +
        '<input class="subjective-input" type="text" id="sa-'+p.num+'" placeholder="답 입력 (예: 5, -3, x^2+1)" oninput="onSubjectiveInput('+p.num+')" autocomplete="off" autocorrect="off" autocapitalize="off">' +
        '<div class="input-hint">x² → x^2 / 분수 → 1/2 / 루트 → sqrt(2)</div>' +
        '<button class="teacher-req-btn" id="treq-'+p.num+'" onclick="toggleTeacherReq('+p.num+')">👨‍🏫 선생님께 채점 받기</button>';
    }
    list.appendChild(div);
  });
}

function selectChoice(num, val) {
  sState.answers[num] = String(val);
  for (var i=1; i<=5; i++) {
    var btn = document.getElementById('cb-'+num+'-'+i);
    if (btn) btn.classList.toggle('selected', i === val);
  }
  updateProgress();
}

function onSubjectiveInput(num) {
  var el = document.getElementById('sa-'+num);
  if (el) {
    sState.answers[num] = el.value.trim();
    updateProgress();
  }
}

function toggleTeacherReq(num) {
  var btn = document.getElementById('treq-'+num);
  if (sState.teacherRequested.has(num)) {
    sState.teacherRequested.delete(num);
    btn.classList.remove('active');
    btn.textContent = '👨‍🏫 선생님께 채점 받기';
  } else {
    sState.teacherRequested.add(num);
    btn.classList.add('active');
    btn.textContent = '✓ 선생님 채점 요청됨';
    sState.answers[num] = '__teacher__';
  }
}

function updateProgress() {
  var filled = Object.keys(sState.answers).filter(function(k){ return sState.answers[k] !== ''; }).length;
  var total = sState.problems.length;
  var pct = total > 0 ? Math.round(filled/total*100) : 0;
  var bar = document.getElementById('s-progress');
  if (bar) bar.style.width = pct+'%';
}

// ── 채점 ──
function sSubmitAnswers() {
  var err = document.getElementById('s-input-err');
  var unanswered = sState.problems.filter(function(p){
    return !sState.answers[p.num] || sState.answers[p.num] === '';
  });
  if (unanswered.length > 0) {
    err.textContent = '미입력 문제: '+unanswered.map(function(p){return p.num+'번';}).join(', ');
    return;
  }
  err.textContent = '';
  var result = gradeAnswers(sState.answers);
  saveResultToSheets(result);
  showResult(result);
}

function normalize(str) {
  return String(str)
    .replace(/①/g,'1').replace(/②/g,'2').replace(/③/g,'3')
    .replace(/④/g,'4').replace(/⑤/g,'5')
    .replace(/\^/g,'').replace(/\s/g,'').toLowerCase();
}

function gradeAnswers(answersMap) {
  var correct=0, autoTotal=0, teacherTotal=0;
  var details = [];

  sState.problems.forEach(function(p){
    var studentAns = answersMap[p.num] || '';

    if (studentAns === '__teacher__' || sState.teacherRequested.has(p.num)) {
      teacherTotal++;
      details.push({num:p.num, type:'teacher', studentAns:'선생님 채점 요청', correctAns:p.answer, status:'teacher'});
      return;
    }

    autoTotal++;
    var isCorrect = normalize(studentAns) === normalize(p.answer);
    if (isCorrect) correct++;
    details.push({num:p.num, type:p.type, studentAns:studentAns, correctAns:p.answer, status:isCorrect?'correct':'wrong'});
  });

  var score = autoTotal > 0 ? Math.round(correct/autoTotal*100) : 0;
  return {
    quizId: sState.quizId, quizName: sState.quizName,
    studentName: sState.studentName,
    correct:correct, autoTotal:autoTotal, teacherTotal:teacherTotal,
    score:score, details:details
  };
}

// ── 결과 표시 ──
function showResult(r) {
  document.getElementById('r-score').textContent = r.score;
  document.getElementById('r-name').textContent = r.studentName+' 학생';
  document.getElementById('r-fraction').textContent = '자동채점 '+r.correct+'/'+r.autoTotal+'  |  선생님채점 '+r.teacherTotal+'문제';

  var wrongNums = r.details.filter(function(d){return d.status==='wrong';}).map(function(d){return d.num+'번';});
  var wrongWrap = document.getElementById('r-wrong-wrap');
  wrongWrap.innerHTML = wrongNums.length > 0
    ? '<div class="wrong-summary"><div class="wrong-title">❌ 틀린 문제 ('+wrongNums.length+'개)</div><div class="wrong-nums">'+wrongNums.join('  ·  ')+'</div></div>'
    : '<div class="wrong-summary" style="background:var(--green-bg);border-color:rgba(30,122,74,0.2)"><div class="wrong-title" style="color:var(--green)">🎉 모두 맞았어요!</div></div>';

  // 답안 수정 섹션 숨기기
  document.getElementById('r-edit-wrap').style.display = 'none';

  // 문제별 결과 + 인라인 수정
  var detail = document.getElementById('r-detail');
  detail.innerHTML = '';

  r.details.forEach(function(d){
    var isChoice = !!sState.problems.find(function(p){return p.num==d.num && p.type==='객관식5';});
    var wrap = document.createElement('div');
    wrap.style.cssText = 'padding:12px 0;border-bottom:1px solid var(--border);';

    if (d.status === 'teacher') {
      wrap.innerHTML =
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<div class="rnum">'+d.num+'번</div>' +
          '<div class="rcontent"><div class="rstudent">선생님 채점 요청</div></div>' +
          '<div class="rbadge badge-teacher">채점대기</div>' +
        '</div>';
    } else {
      var badge = d.status==='correct'
        ? '<div class="rbadge badge-o">✓</div>'
        : '<div class="rbadge badge-x">✗</div>';

      // 상단: 번호 + 내 답 + O/X
      wrap.innerHTML =
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
          '<div class="rnum">'+d.num+'번</div>' +
          '<div class="rcontent"><div class="rstudent">내 답: <strong>'+( d.studentAns||'(미입력)')+'</strong></div></div>' +
          badge +
        '</div>';

      // 하단: 수정 입력
      var editDiv = document.createElement('div');
      editDiv.style.cssText = 'margin-left:44px;';

      if (isChoice) {
        var btnsHtml = '<div style="display:flex;gap:6px;align-items:center">';
        btnsHtml += '<span style="font-size:11px;color:var(--muted);margin-right:2px">수정:</span>';
        for (var i=1; i<=5; i++) {
          var isSel = String(d.studentAns)===String(i);
          var selStyle = isSel ? 'background:var(--accent);color:white;border-color:var(--accent)' : 'background:var(--bg);color:var(--text)';
          btnsHtml += '<button style="padding:6px 10px;border-radius:6px;border:1.5px solid var(--border);cursor:pointer;font-weight:700;font-size:13px;'+selStyle+'" onclick="editChoice('+d.num+','+i+',this)">'+i+'</button>';
        }
        btnsHtml += '</div>';
        editDiv.innerHTML = btnsHtml;
      } else {
        editDiv.innerHTML =
          '<div style="display:flex;gap:8px;align-items:center">' +
            '<span style="font-size:11px;color:var(--muted);white-space:nowrap">수정:</span>' +
            '<input type="text" value="'+d.studentAns+'" id="edit-'+d.num+'" ' +
              'style="flex:1;padding:7px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;font-family:DM Mono,monospace;outline:none;background:var(--bg)" ' +
              'autocomplete="off" autocorrect="off" autocapitalize="off">' +
          '</div>';
      }
      wrap.appendChild(editDiv);
    }
    detail.appendChild(wrap);
  });

  // 재채점 버튼
  var tw = document.getElementById('r-teacher-wrap');
  var teacherNums = r.details.filter(function(d){return d.status==='teacher';}).map(function(d){return d.num+'번';});
  tw.innerHTML =
    '<button class="btn btn-yellow" onclick="sRegrade()" style="margin-bottom:8px">↺ 수정 후 재채점하기</button>' +
    (teacherNums.length > 0
      ? '<div class="card" style="margin-top:0"><div class="card-title">선생님 채점 대기</div><div style="font-size:13px;color:var(--muted);line-height:1.8">'+teacherNums.join(', ')+'</div></div>'
      : '');

  showView('v-student-result');
}

function editChoice(num, val, btn) {
  var parent = btn.parentNode;
  parent.querySelectorAll('button').forEach(function(b){
    b.style.background = 'var(--bg)';
    b.style.color = 'var(--text)';
    b.style.borderColor = 'var(--border)';
  });
  btn.style.background = 'var(--accent)';
  btn.style.color = 'white';
  btn.style.borderColor = 'var(--accent)';
}

// ── 재채점 ──
function sRegrade() {
  var newAnswers = Object.assign({}, sState.answers);
  sState.problems.forEach(function(p){
    if (sState.teacherRequested.has(p.num)) return;
    if (p.type === '객관식5') {
      var parent = document.querySelector('#r-edit-list [onclick*="editChoice('+p.num+',"]')
        || document.querySelector('#r-edit-list');
      // 객관식 선택값 읽기
      var btns = document.querySelectorAll('[onclick*="editChoice('+p.num+',"]');
      btns.forEach(function(b){
        if (b.style.background.includes('1a1a1a') || b.style.background === 'var(--accent)' || b.style.background === 'rgb(26, 26, 26)') {
          var match = b.getAttribute('onclick').match(/editChoice\(\d+,(\d+)/);
          if (match) newAnswers[p.num] = match[1];
        }
      });
    } else {
      var el = document.getElementById('edit-'+p.num);
      if (el) newAnswers[p.num] = el.value.trim();
    }
  });

  sState.answers = newAnswers;
  var result = gradeAnswers(newAnswers);
  saveResultToSheets(result);
  showResult(result);
}

// ── Sheets 저장 ──
function saveResultToSheets(result) {
  try {
    fetch(GAS_URL, {
      method:'POST',
      body:JSON.stringify({
        action:'saveResult',
        quizId:result.quizId, quizName:result.quizName,
        studentName:result.studentName, score:result.score,
        correct:result.correct, autoTotal:result.autoTotal,
        teacherTotal:result.teacherTotal, details:result.details
      })
    });
  } catch(e) { console.log('저장 실패:', e); }
}

// ── 리셋 ──
function sReset() {
  sState.quizId=''; sState.studentName=''; sState.problems=[];
  sState.answers={}; sState.teacherRequested=new Set();
  document.getElementById('s-name').value='';
  document.getElementById('s-select-err').textContent='';
  document.getElementById('topbar-title').textContent='학생 채점';
  showView('v-student-select');
}

// ── 선생님: PDF 등록 ──
function tOnFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  tState.fileType = file.type;
  var reader = new FileReader();
  reader.onload = function(ev){
    tState.fileBase64 = ev.target.result.split(',')[1];
    var fn = document.getElementById('t-file-name');
    fn.textContent = '✓ '+file.name;
    fn.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

async function tRegisterQuiz() {
  var quizId = document.getElementById('t-quiz-id').value.trim();
  var quizName = document.getElementById('t-quiz-name').value.trim();
  var quizCount = parseInt(document.getElementById('t-quiz-count').value);
  var msgEl = document.getElementById('t-upload-msg');
  var btn = document.getElementById('t-register-btn');

  if (!quizId) { msgEl.innerHTML='<div class="error-box">시험지 ID를 입력해주세요.</div>'; return; }
  if (!quizName) { msgEl.innerHTML='<div class="error-box">시험지 이름을 입력해주세요.</div>'; return; }
  if (!quizCount||quizCount<1) { msgEl.innerHTML='<div class="error-box">문제 수를 입력해주세요.</div>'; return; }
  if (!tState.fileBase64) { msgEl.innerHTML='<div class="error-box">파일을 올려주세요.</div>'; return; }

  btn.disabled=true; btn.classList.add('loading');
  msgEl.innerHTML='<div class="info-box">AI가 답지를 읽고 있어요... (10~30초)</div>';

  try {
    var mediaType = tState.fileType==='application/pdf' ? 'application/pdf' : (tState.fileType||'image/jpeg');
    var contentArr = mediaType==='application/pdf'
      ? [{type:'document',source:{type:'base64',media_type:'application/pdf',data:tState.fileBase64}},{type:'text',text:getExtractPrompt(quizCount)}]
      : [{type:'image',source:{type:'base64',media_type:mediaType,data:tState.fileBase64}},{type:'text',text:getExtractPrompt(quizCount)}];

    var response = await fetch(WORKERS_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:contentArr}]})
    });
    var data = await response.json();
    var raw = data.content.map(function(c){return c.text||'';}).join('');
    var cleaned = raw.replace(/```json|```/g,'').trim();
    var problems = JSON.parse(cleaned);

    var saveRes = await fetch(GAS_URL, {method:'POST',body:JSON.stringify({action:'saveQuiz',quizId:quizId,quizName:quizName,problems:problems})});
    var saveData = await saveRes.json();
    if (saveData.success) {
      msgEl.innerHTML='<div class="success-box">✓ '+saveData.message+'</div>';
      loadTeacherQuizList(); loadQuizList('s-quiz-select');
    } else {
      msgEl.innerHTML='<div class="error-box">저장 실패: '+(saveData.message||'오류')+'</div>';
    }
  } catch(e) {
    msgEl.innerHTML='<div class="error-box">오류: '+e.message+'</div>';
  }
  btn.disabled=false; btn.classList.remove('loading');
}

function getExtractPrompt(count) {
  return '이 파일은 수학 답지입니다.\n1번부터 '+count+'번까지 각 문제의 정답을 추출해주세요.\n\n규칙:\n- 반드시 JSON 배열로만 응답\n- 형식: [{"num": 문제번호, "type": "문제유형", "answer": "정답"}, ...]\n- type: "객관식5"(①~⑤) 또는 "단답형"\n- 객관식 정답은 번호만: "1","2","3","4","5"\n- 마크다운, 코드블록 없이 JSON만 출력';
}

window.onload = function(){ loadQuizList('s-quiz-select'); };
</script>
